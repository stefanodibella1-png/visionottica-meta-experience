name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # Android SDK preinstalled ($ANDROID_HOME)
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (Developer Mode credentials = 0)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../VisionOttica-Meta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VisionOttica-Meta-apk
          path: VisionOttica-Meta.apk

      - name: Publish to the "apk-latest" release (direct download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: VisionOttica Meta — ultima build
          prerelease: true
          make_latest: false
          body: |
            APK di sviluppo (debug) generato automaticamente dal commit ${{ github.sha }}.
            Installazione: scarica VisionOttica-Meta.apk dal telefono e consenti "Installa app sconosciute".
            Gli occhiali richiedono la Modalità sviluppatore attiva nell'app Meta AI.
          files: VisionOttica-Meta.apk
